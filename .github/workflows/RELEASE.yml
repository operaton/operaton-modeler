name: RELEASE
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v1.2.0)'
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  pre_release:
    name: Prepare release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
    - name: Get tag
      id: tag
      env:
        TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::'$TAG' is not a release tag (expected vX.Y.Z)"
          exit 1
        fi
        echo "TAG=$TAG" >> $GITHUB_OUTPUT
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ steps.tag.outputs.TAG }}
    - name: Verify tag matches app version
      env:
        TAG: ${{ steps.tag.outputs.TAG }}
      run: |
        VERSION=$(node -p "require('./app/package.json').version.split('-')[0]")
        if [ "$TAG" != "v$VERSION" ]; then
          echo "::error::Tag $TAG does not match app/package.json version $VERSION"
          exit 1
        fi
    - name: Create draft GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.tag.outputs.TAG }}
      run: |
        if gh release view "$TAG" > /dev/null 2>&1; then
          echo "Release $TAG already exists"
        else
          gh release create "$TAG" --draft --verify-tag \
            --title "Operaton Modeler $TAG" --generate-notes
        fi

  build_release:
    name: Build release (${{ matrix.platform }})
    needs: pre_release
    strategy:
      matrix:
        include:
        - os: ubuntu-latest
          platform: linux
        - os: macos-latest
          platform: mac
        - os: windows-2022
          platform: win
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Required to upload release artifacts to GitHub
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.pre_release.outputs.tag }}
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build and upload release artifacts
      env:
        BUILD_REF: ${{ needs.pre_release.outputs.tag }}
        IS_CI: true
        NODE_ENV: "production"
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        # code signing (optional, skipped when not configured)
        CSC_LINK: "${{ secrets.CSC_LINK }}"
        CSC_KEY_PASSWORD: "${{ secrets.CSC_KEY_PASSWORD }}"
        APPLE_DEVELOPER_ID: "${{ secrets.APPLE_DEVELOPER_ID }}"
        APPLE_DEVELOPER_ID_PASSWORD: "${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}"
        APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
        AZURE_CERT_PROFILE_NAME: "${{ secrets.AZURE_CERT_PROFILE_NAME }}"
        AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
        AZURE_CLIENT_SECRET: "${{ secrets.AZURE_CLIENT_SECRET }}"
        AZURE_CODE_SIGNING_NAME: "${{ secrets.AZURE_CODE_SIGNING_NAME }}"
        AZURE_ENDPOINT: "${{ secrets.AZURE_ENDPOINT }}"
        AZURE_PUBLISHER_NAME: "${{ secrets.AZURE_PUBLISHER_NAME }}"
        AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
        # telemetry and error tracking (optional)
        MIXPANEL_TOKEN: "${{ secrets.MIXPANEL_PROJECT_TOKEN }}"
        MIXPANEL_STAGE: "prod"
        SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
        SENTRY_DSN: "${{ secrets.SENTRY_DSN }}"
        SENTRY_ORG: "${{ secrets.SENTRY_ORG }}"
        SENTRY_PROJECT: "${{ secrets.SENTRY_PROJECT }}"
        UPDATES_SERVER_PRODUCT_NAME: "${{ secrets.UPDATES_SERVER_PRODUCT_NAME }}"
      run: npm run build -- --${{ matrix.platform }} --publish

  publish_release:
    name: Publish release
    needs: [ pre_release, build_release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ needs.pre_release.outputs.tag }}
      run: |
        gh release edit "$TAG" --draft=false --latest
        gh release view "$TAG" --json url,assets \
          --jq '"Published " + .url, (.assets[] | " - " + .name)'
