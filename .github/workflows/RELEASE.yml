name: RELEASE
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  pre_release:
    name: Prepare release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.TAG }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref }}
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Validate release tag and application versions
      id: tag
      run: |
        VERSION=$(node app/util/validate-release-version.js "$GITHUB_REF")
        echo "TAG=v$VERSION" >> "$GITHUB_OUTPUT"
        VERSION_WITHOUT_METADATA=${VERSION%%+*}
        if [[ "$VERSION_WITHOUT_METADATA" == *-* ]]; then
          echo "PRERELEASE=true" >> "$GITHUB_OUTPUT"
        else
          echo "PRERELEASE=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ steps.tag.outputs.TAG }}
        RELEASE_PRERELEASE: ${{ steps.tag.outputs.PRERELEASE }}
      run: |
        if [ "$RELEASE_PRERELEASE" = "true" ]; then
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --prerelease --latest=false
        else
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG"
        fi

  build_release:
    name: Build release
    needs: pre_release
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-2022 ]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    # Required to upload release artifacts to GitHub
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        ref: refs/tags/${{ needs.pre_release.outputs.tag }}
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build release (Linux)
      if: ${{ runner.OS == 'Linux' }}
      env:
        BUILD_REF: ${{ needs.pre_release.outputs.tag }}
        CSC_LINK: "${{ secrets.CSC_LINK }}"
        CSC_KEY_PASSWORD: "${{ secrets.CSC_KEY_PASSWORD }}"
        IS_CI: true
        MIXPANEL_TOKEN: "${{ secrets.MIXPANEL_PROJECT_TOKEN }}"
        MIXPANEL_STAGE: "prod"
        SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
        SENTRY_DSN: "${{ secrets.SENTRY_DSN }}"
        SENTRY_ORG: "${{ secrets.SENTRY_ORG }}"
        SENTRY_PROJECT: "${{ secrets.SENTRY_PROJECT }}"
        UPDATES_SERVER_PRODUCT_NAME: "${{ secrets.UPDATES_SERVER_PRODUCT_NAME }}"
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        NODE_ENV: "production"
      run: npm run build -- --linux --publish
    - name: Build release (MacOS)
      if: ${{ runner.os == 'macOS' }}
      env:
        APPLE_DEVELOPER_ID: "${{ secrets.APPLE_DEVELOPER_ID }}"
        APPLE_DEVELOPER_ID_PASSWORD: "${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}"
        BUILD_REF: ${{ needs.pre_release.outputs.tag }}
        APPLE_TEAM_ID: "${{ secrets.APPLE_TEAM_ID }}"
        CSC_LINK: "${{ secrets.CSC_LINK }}"
        CSC_KEY_PASSWORD: "${{ secrets.CSC_KEY_PASSWORD }}"
        IS_CI: true
        MIXPANEL_TOKEN: "${{ secrets.MIXPANEL_PROJECT_TOKEN }}"
        MIXPANEL_STAGE: "prod"
        SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
        SENTRY_DSN: "${{ secrets.SENTRY_DSN }}"
        SENTRY_ORG: "${{ secrets.SENTRY_ORG }}"
        SENTRY_PROJECT: "${{ secrets.SENTRY_PROJECT }}"
        UPDATES_SERVER_PRODUCT_NAME: "${{ secrets.UPDATES_SERVER_PRODUCT_NAME }}"
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        NODE_ENV: "production"
      run: npm run build -- --mac --publish
    - name: Build release (Windows)
      if: ${{ runner.os == 'Windows' }}
      env:
        BUILD_REF: ${{ needs.pre_release.outputs.tag }}
        AZURE_CERT_PROFILE_NAME: "${{ secrets.AZURE_CERT_PROFILE_NAME }}"
        AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}"
        AZURE_CLIENT_SECRET: "${{ secrets.AZURE_CLIENT_SECRET }}"
        AZURE_CODE_SIGNING_NAME: "${{ secrets.AZURE_CODE_SIGNING_NAME }}"
        AZURE_ENDPOINT: "${{ secrets.AZURE_ENDPOINT }}"
        AZURE_PUBLISHER_NAME: "${{ secrets.AZURE_PUBLISHER_NAME }}"
        AZURE_TENANT_ID: "${{ secrets.AZURE_TENANT_ID }}"
        IS_CI: true
        MIXPANEL_TOKEN: "${{ secrets.MIXPANEL_PROJECT_TOKEN }}"
        MIXPANEL_STAGE: "prod"
        SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}"
        SENTRY_DSN: "${{ secrets.SENTRY_DSN }}"
        SENTRY_ORG: "${{ secrets.SENTRY_ORG }}"
        SENTRY_PROJECT: "${{ secrets.SENTRY_PROJECT }}"
        UPDATES_SERVER_PRODUCT_NAME: "${{ secrets.UPDATES_SERVER_PRODUCT_NAME }}"
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        NODE_ENV: "production"
      run: npm run build -- --win --publish
